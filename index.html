<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$BUBBLE Coin</title>
    <style>
        /* Base Styles */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #020818;
            background-image: url('assets/stonk-background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #fff;
            letter-spacing: -2px;
        }

        .market-cap-container {
            font-size: 1.5rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 40px;
            z-index: 10;
        }

        /* The Bubble */
        .bubble-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 400px;
            width: 400px;
        }

        .bubble {
            width: 150px;
            height: 150px;
            object-fit: contain;
            position: relative;
            transition: width 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                        height 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: float 4s ease-in-out infinite;
            pointer-events: none;
            user-select: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
        }

        #mc-value {
            color: #fff;
        }
    </style>
</head>
<body>

    <h1>$BUBBLE</h1>
    
    <div class="market-cap-container">
        Market Cap: <span id="mc-value">loading…</span>
    </div>

    <div class="bubble-wrapper">
        <img id="bubble" class="bubble" src="assets/bubble-character.png" alt="Inflatable balloon-head $BUBBLE character">
    </div>

    <script>
        const mcDisplay = document.getElementById('mc-value');
        const bubble = document.getElementById('bubble');

        // $BUBBLE token on stonk.fun (Raydium LaunchLab curve, graduates to Raydium).
        // ?mint=<address> overrides for testing.
        const MINT = 'NFH7R1aRMr9UUkXm8pcYHUwdMotGgvitG1ZZBmv43Vd';
        const API_URL = 'https://www.stonkfun.xyz/api/public/v1/tokens/';

        const MIN_MC = 4000;    // USD, ~launch market cap
        const MAX_MC = 150000;  // USD, past graduation
        const MIN_SIZE = 120; // px
        const MAX_SIZE = 320; // px
        const POLL_MS = 12000;

        function formatMarketCap(mc) {
            if (mc >= 1e6) return `$${(mc / 1e6).toFixed(2)}M`;
            if (mc >= 1e3) return `$${(mc / 1e3).toFixed(2)}k`;
            return `$${mc.toFixed(0)}`;
        }

        function sizeForMarketCap(mc) {
            // Log scale so curve-phase moves and post-graduation moves both read
            const lo = Math.log(MIN_MC), hi = Math.log(MAX_MC);
            const pct = Math.min(Math.max((Math.log(Math.max(mc, 1)) - lo) / (hi - lo), 0), 1);
            return MIN_SIZE + pct * (MAX_SIZE - MIN_SIZE);
        }

        async function updateStats() {
            const mint = new URLSearchParams(location.search).get('mint') || MINT;
            try {
                const res = await fetch(API_URL + mint);
                if (res.status === 404) {
                    // Token has not launched yet
                    mcDisplay.innerText = 'awaiting launch';
                    bubble.style.width = `${MIN_SIZE}px`;
                    bubble.style.height = `${MIN_SIZE}px`;
                } else if (res.ok) {
                    const json = await res.json();
                    const mc = json?.data?.token?.market?.marketCapUsd;
                    // StonkFun reports USD market cap across the bonding curve
                    // and after graduation, so one number covers both phases
                    if (typeof mc === 'number' && mc > 0) {
                        mcDisplay.innerText = formatMarketCap(mc);
                        const newSize = sizeForMarketCap(mc);
                        bubble.style.width = `${newSize}px`;
                        bubble.style.height = `${newSize}px`;
                    }
                }
                // On rate limits or other errors, keep the last shown value
            } catch (err) {
                console.warn('market cap fetch failed:', err);
            }
            setTimeout(updateStats, POLL_MS);
        }

        // Initialize
        updateStats();
    </script>
</body>
</html>
